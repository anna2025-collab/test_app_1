openapi: 3.0.3
info:
  title: API лендинга разработчика
  version: 1.0.0
servers:
  - url: https://testapp1-production-ba44.up.railway.app
    description: Рабочий API на Railway
                   - url: http://localhost:8000
                   description: Локальный запуск

paths:
  /api/contact:
    post:
      summary: Отправить обращение
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
                - email
                - comment
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                phone:
                  type: string
                  example: "+79990000000"
                email:
                  type: string
                  format: email
                comment:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        "201":
          description: Обращение принято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          description: Слишком много запросов
        "500":
          description: Ошибка обработки обращения
  /api/health:
    get:
      summary: Проверка состояния сервиса
      responses:
        "200":
          description: Состояние сервиса
  /api/metrics:
    get:
      summary: Метрики обращений
      responses:
        "200":
          description: Метрики из JSON-файла и количество обращений в базе данных
components:
  schemas:
    ContactResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            ai:
              type: object
              properties:
                provider:
                  type: string
                available:
                  type: boolean
                sentiment:
                  type: string
                category:
                  type: string
                auto_reply:
                  type: string
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
